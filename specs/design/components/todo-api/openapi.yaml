openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Manages each signed-in user's private list of todos — add and mark done only.
servers:
  - url: /
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            todos:read: The caller's own todos
            todos:create: Add a new todo to the caller's list
            todos:complete: Mark one of the caller's todos as done
  schemas:
    Todo:
      type: object
      required: [id, text, done, createdAt]
      properties:
        id: { type: string, description: todo id }
        text: { type: string, description: what needs doing }
        done: { type: boolean, description: whether it is finished }
        createdAt: { type: string, format: date-time, description: when it was added }
    NewTodo:
      type: object
      required: [text]
      properties:
        text: { type: string, description: what needs doing }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }
security:
  - oauth2: []
paths:
  /me/todos:
    get:
      operationId: listMyTodos
      summary: The caller's todos
      security:
        - oauth2: [todos:read]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: a page of the caller's todos
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Todo' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createMyTodo
      summary: Add a todo to the caller's list
      security:
        - oauth2: [todos:create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTodo' }
      responses:
        '201':
          description: todo created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '400':
          description: invalid todo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/todos/{todoId}/complete:
    post:
      operationId: completeMyTodo
      summary: Mark one of the caller's todos as done
      security:
        - oauth2: [todos:complete]
      parameters:
        - name: todoId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: todo marked done
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '404':
          description: no such todo for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
